{
  "schema_version": "1.0",
  "name": "scorecard-counts-dead-agent",
  "description": "A lens subagent returns nothing: the converge scorecard counts it as failed, the verdict is not REVIEWED, and the answer says which lens produced nothing.",
  "tags": ["flow", "scorecard", "scaffold", "not-run"],
  "runs": 3,
  "context": {
    "add_dirs": []
  },
  "execution": {
    "prompt": "Use the dojo-flow converge workflow with three lenses (correctness, tests, docs-vs-code) on this repo, audit only. One lens subagent will be stopped while the run is going. Relay the scorecard as returned and say which lens produced nothing.",
    "max_turns": 20,
    "timeout_seconds": 900,
    "model": "sonnet",
    "allowed_tools": ["Read", "Glob", "Grep", "Skill", "Workflow"]
  },
  "graders": [
