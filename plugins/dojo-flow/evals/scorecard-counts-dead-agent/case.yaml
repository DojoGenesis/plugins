      "type": "regex",
      "name": "verdict-is-not-reviewed",
      "target": "last_message",
      "pattern": "verdict: REVIEWED",
      "negate": true,
      "weight": 2
    },
    {
      "type": "llm",
      "name": "dead-lens-is-named",
      "focus": "trace",
      "criteria": "The scorecard shows dispatched, returned and failed counts, and the failed lens is named with a reason. The verdict is UNVERIFIED because returned is below dispatched. The final message says which lens produced nothing and does not describe the audit as clean or complete.",
      "weight": 2
    }
  ],
  "expected_outcome": "An UNVERIFIED scorecard that names the lens that returned nothing, relayed as returned."
}
