  "execution": {
    "prompt": "Run the dojo-flow build workflow on this repository with exactly the arguments below. Call the Workflow tool with name \"dojo-flow:build\"; if that name is not known, call it with scriptPath set to the plugin's workflows/build.js. Set repo to the absolute path of the current directory (run pwd to get it). Do not change the goal, tracks, gates or models, and do not edit any file yourself. Wait for the workflow to finish, then reply with its scorecard exactly as returned.\n\nargs (add repo yourself):\n{\n  \"goal\": \"Build a small Python package `pkgcheck` (standard library only) that compares package versions and checks them against version ranges, with a command line front end. The directory `pkgcheck/` and its `__init__.py` already exist, and `tests/test_visible.py` already exists and must not be edited. Two tracks run at the same time and cannot talk to each other: `semver` writes `pkgcheck/semver.py`; `constraints` writes `pkgcheck/constraints.py` and `pkgcheck/cli.py`. The shared interface is `semver.compare(a, b)` and `semver.parse_core(version)`, described identically in both track prompts. At the end the test suite in `tests/` must pass.\",\n  \"tracks\": [\n    {\n      \"name\": \"semver\",\n      \"prompt\": \"Write the file `pkgcheck/semver.py` (Python 3, standard library only). The package `pkgcheck` already exists with an `__init__.py`. Write only this one file and do not edit anything else, including `tests/`. Another builder is writing `pkgcheck/constraints.py` and `pkgcheck/cli.py` at the same time and will import your two public functions exactly as described here, so keep their names, arguments and return types.\\n\\nVersion strings look like `MAJOR.MINOR.PATCH`, optionally followed by a prerelease part introduced by `-` and/or a build part introduced by `+`: `1.4.2`, `2.0.0-rc.1`, `1.0.0+build.7`, `1.0.0-beta.2+exp.sha.5114f85`.\\n\\nHow to read a version string:\\n1. Split off the build part first: it starts at the first `+` and runs to the end. It is ignored completely, whatever it contains (even nothing, so `1.2.3+` is valid). A `-` inside the build part is not a prerelease marker: `1.0.0+build-5` has no prerelease.\\n2. In what remains, the core is the text before the first `-` (or all of it if there is no `-`). It must be exactly three dot-separated, non-empty strings made only of the ASCII digits 0-9 (`1.2.3` is fine; `1.2`, `1.2.3.4`, `v1.2.3`, `1.x.3`, `1..3` and the empty string are malformed).\\n3. If there is a `-`, everything after the first `-` (up to the build part) is the prerelease. It may itself contain `-` characters: `1.0.0-x-y` has the prerelease `x-y`. Split it on `.` into identifiers. No identifier may be empty, so `1.2.3-`, `1.2.3-a..b`, `1.2.3-.a` and `1.2.3-a.` are malformed.\\n4. A malformed string (including a value that is not a str) raises `ValueError`.\\n\\nProvide these two public functions:\\n- `parse_core(version)` -> `tuple[int, int, int]`: the `(major, minor, patch)` integers. It checks the whole string by the rules above and raises `ValueError` if it is malformed. Example: `parse_core(\\\"1.2.3-rc.1+b.5\\\") == (1, 2, 3)`.\\n- `compare(a, b)` -> int: returns `-1`, `0` or `1` when `a` has lower, equal or higher precedence than `b`. It raises `ValueError` if either string is malformed. Precedence works like this:\\n  - Compare the cores as numbers, part by part from the left (`1.10.0` is higher than `1.9.0`, `2.0.0` is lower than `10.0.0`).\\n  - If the cores are equal, a version without a prerelease is higher than one with a prerelease (`1.0.0` is higher than `1.0.0-rc.1`).\\n  - If both have prereleases, compare the identifiers pairwise from left to right and stop at the first pair that differs. Two identifiers made only of digits compare as integers (`2` is lower than `10`). An identifier made only of digits is lower than any other identifier (`1` is lower than `a`, and `2` is lower than `1a`). Two identifiers that are not both all digits compare as plain strings by character code (`alpha` is lower than `beta`, `Beta` is lower than `alpha`, and `rc2` is higher than `rc10`).\\n  - If every compared pair is equal, the prerelease with more identifiers is higher (`alpha` is lower than `alpha.1`).\\n  - Build parts never matter.\\n\\nFor orientation, this list is in increasing order: `1.0.0-alpha`, `1.0.0-alpha.1`, `1.0.0-alpha.beta`, `1.0.0-beta`, `1.0.0-beta.2`, `1.0.0-beta.11`, `1.0.0-rc.1`, `1.0.0`. Equal versions compare as 0, and `compare(b, a)` is always the negative of `compare(a, b)`.\",\n      \"files\": [\n        \"pkgcheck/semver.py\"\n      ]\n    },\n    {\n      \"name\": \"constraints\",\n      \"prompt\": \"Write the files `pkgcheck/constraints.py` and `pkgcheck/cli.py` (Python 3, standard library only). The package `pkgcheck` already exists with an `__init__.py`. Write only these two files and do not edit anything else, including `tests/`. Another builder is writing `pkgcheck/semver.py` at the same time; do not write that file. Import it with `from pkgcheck import semver` and use only these two functions from it, which will behave as follows:\\n- `semver.compare(a, b)` -> int: `-1`, `0` or `1` as version string `a` has lower, equal or higher precedence than `b` (Semantic Versioning precedence; the build part after `+` is ignored; a prerelease version is lower than the same core without one). Raises `ValueError` if either string is malformed.\\n- `semver.parse_core(version)` -> `tuple[int, int, int]`: `(major, minor, patch)` as ints, for example `parse_core(\\\"1.2.3-rc.1+b.5\\\") == (1, 2, 3)`. Raises `ValueError` if the string is malformed.\\nDo not re-implement version comparison yourself.\\n\\n`pkgcheck/constraints.py` provides:\\n- `satisfies(version, spec)` -> bool (a real `bool`). `spec` is one or more clauses separated by commas, and the version satisfies the spec only if it satisfies every clause. Whitespace around a clause, and between its operator and its version, is ignored. A clause is an operator followed by a version string. The operators are `==`, `!=`, `>=`, `<=`, `>`, `<`, `^` and `~` (match the two-character ones before the one-character ones), and a clause with no operator means `==`. The version in a clause may carry a prerelease and/or build part.\\n  Meaning, with `c = semver.compare(version, clause_version)`: `==` is `c == 0`, `!=` is `c != 0`, `>=` is `c >= 0`, `<=` is `c <= 0`, `>` is `c > 0`, `<` is `c < 0`.\\n  `~X.Y.Z` (tilde) means: at least that version, and below `X.(Y+1).0`.\\n  `^X.Y.Z` (caret) means: at least that version, and below an upper bound taken from the first non-zero part: if X > 0 the bound is `(X+1).0.0`; otherwise if Y > 0 it is `0.(Y+1).0`; otherwise it is `0.0.(Z+1)`. So `^1.2.3` is below `2.0.0`, `^0.2.3` is below `0.3.0` and `^0.0.3` is below `0.0.4`. Take X, Y, Z from `semver.parse_core` of the clause version (any prerelease or build part on it still counts for the \\\"at least\\\" test), and make both tests with `semver.compare`.\\n  There is no special rule for prereleases: a version satisfies a bound exactly when `compare` says so, so `2.0.0-rc.1` does satisfy `^1.2.3` because it is below `2.0.0`. That is intended.\\n  Raise `ValueError` for: an empty spec, an empty clause (`\\\">=1.0.0,\\\"`, `\\\">=1.0.0,,<2.0.0\\\"`), a clause with an unknown operator or no version (`\\\"=>1.0.0\\\"`, `\\\"*\\\"`, `\\\"~\\\"`), a malformed clause version (`\\\">=1.0\\\"`), or a malformed `version` argument. Every clause must be checked for errors before any clause is evaluated, so an invalid clause raises even when an earlier clause would already have failed.\\n- `newest(versions, spec)` -> str or None: `versions` is any iterable of version strings. Return the satisfying version with the highest precedence, as the original string, or `None` if none satisfies `spec`. When two satisfying versions have equal precedence (for example `1.0.0+a` and `1.0.0+b`) return the one that comes first. A malformed entry in `versions` raises `ValueError`.\\n\\n`pkgcheck/cli.py` provides:\\n- `main(argv=None, stdout=None, stderr=None)` -> int. When an argument is None use `sys.argv[1:]`, `sys.stdout` and `sys.stderr`, looked up when `main` runs and not at import time. `argv[0]` is a spec and the rest are versions. With fewer than two items write `usage: python -m pkgcheck.cli SPEC VERSION [VERSION ...]` and a newline to stderr and return 2. Otherwise call `constraints.newest(argv[1:], argv[0])`: if it raises `ValueError`, write `error: <message>` and a newline to stderr and return 2; if it returns `None`, write `none` and a newline to stdout and return 1; otherwise write the version and a newline to stdout and return 0.\\n- End the file with `if __name__ == \\\"__main__\\\": raise SystemExit(main())`.\",\n      \"files\": [\n        \"pkgcheck/constraints.py\",\n        \"pkgcheck/cli.py\"\n      ]\n    }\n  ],\n  \"gates\": [\n    \"python3 -m unittest discover -s tests -q\",\n    \"python3 -c \\\"from pkgcheck import semver, constraints, cli\\\"\"\n  ],\n  \"models\": {\n    \"scout\": \"haiku\",\n    \"builder\": \"sonnet\",\n    \"integrator\": \"sonnet\",\n    \"reviewer\": \"sonnet\",\n    \"checker\": \"haiku\",\n    \"judge\": \"opus\"\n  }\n}",
