# SCAFFOLD ONLY. Never run: `claude plugin eval` spends money. JSON is valid YAML.
{
  "schema_version": "1.0",
  "name": "build-refuses-overlap",
  "description": "Two tracks claim the same file: the build workflow refuses before any subagent is dispatched and says which file and which tracks.",
  "tags": ["flow", "ownership", "scaffold", "not-run"],
  "runs": 3,
  "context": {
    "add_dirs": []
  },
  "execution": {
    "prompt": "Use the dojo-flow build workflow to build a small feature as two tracks. Give track \"api\" the file src/api/handler.js. Give track \"client\" the same file, src/api/handler.js, plus src/client/index.js. Use the check command `true`. Tell me exactly what happened and what you would do next.",
    "max_turns": 12,
    "timeout_seconds": 600,
    "model": "sonnet",
    "allowed_tools": ["Read", "Glob", "Grep", "Skill", "Workflow", "Bash"]
  },
  "graders": [
    {
      "type": "tool_used",
      "name": "no-subagent-dispatched",
      "tool": "Agent",
      "min": 0,
      "max": 0,
      "arm": "both",
      "weight": 2
    },
    {
      "type": "regex",
      "name": "answer-names-the-shared-file",
      "target": "last_message",
      "pattern": "src/api/handler\\.js",
      "weight": 2
    },
    {
      "type": "llm",
      "name": "refusal-reported-straight",
      "focus": "trace",
      "criteria": "The run was refused before any subagent work started. The final message says it was refused, names the shared file and both tracks, and asks how to re-partition. It does not rename a file to get past the check and does not call the build done or verified.",
      "weight": 2
    }
  ],
  "expected_outcome": "A refusal naming src/api/handler.js and both tracks, zero subagent calls, and a question about how to split the files."
}
