# Held-out case for the pre-registered routing eval (evals/routing-2026-10-23/PREREG-2026-10-23-routing.md).
# The task was written by an independent model author from held-out-brief.md, without access to this
# repository; its hidden tests live in evals/routing-2026-10-23/cases/, never in the sandbox. The graders
# are the evaluator's, fixed by the pre-registration. JSON is valid YAML. Runs spend money: never run
# without a cap and a yes.
{
  "schema_version": "1.0",
  "name": "hr-limiter-starve",
  "description": "Subtle token-bucket bug: whole-token refill math throws away fractional progress whenever the bucket is looked at more often than once per token interval; naive fixes bank idle time.",
  "tags": [
    "held-out",
    "routing",
    "careful"
  ],
  "runs": 6,
  "context": {
    "scaffold_script": "scaffold.sh",
    "add_dirs": []
  },
  "execution": {
    "prompt": "Our rate limiter has a nasty problem. With a policy of 2 requests per 4 seconds, a client that gets a 429 and keeps retrying every quarter of a second is never let back in, even after waiting far longer than the two seconds it should take for a slot to free up. A client that goes quiet for a few seconds and then tries once gets through fine, and people polling the remaining-quota status seem to cause the same trouble. The tests in tests/ all pass, so they don't cover it. Ask a subagent to review the token bucket in `ratelimit/bucket.py` carefully and work out what actually causes this (not a guess), then fix it so those clients get a slot back on time, without changing how the limiter behaves for clients that never hit the problem.",
    "max_turns": 16,
    "timeout_seconds": 900,
    "model": "opus",
    "allowed_tools": [
      "Read",
      "Edit",
      "Write",
      "Bash",
      "Glob",
      "Grep",
      "Agent",
      "Skill"
    ]
  },
  "graders": [
    {
      "type": "llm",
      "name": "quality-judge",
      "focus": "files",
      "criteria": "You are grading the final state of a small Python project after a coding task. Read the project's files. A correct finish: The bucket keeps fractional refill progress across frequent calls so retrying or polling clients regain a token on schedule, does not bank time spent full, and leaves all existing bucket and limiter behaviour unchanged. Decide whether the code now does what that sentence describes, judging behaviour, not style or comments. PASS if it does. FAIL if it does not, or only partly does."
    },
    {
      "type": "tool_used",
      "name": "dispatched",
      "tool": "Agent",
      "min": 1
    },
    {
      "type": "regex",
      "name": "hook-warned",
      "target": "trace",
      "pattern": "dojo-router: this .* dispatch names no model",
      "arm": "with-only"
    }
  ],
  "expected_outcome": "The bucket keeps fractional refill progress across frequent calls so retrying or polling clients regain a token on schedule, does not bank time spent full, and leaves all existing bucket and limiter behaviour unchanged."
}
