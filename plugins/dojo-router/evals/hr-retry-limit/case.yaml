# Held-out case for the pre-registered routing eval (evals/routing-2026-10-23/PREREG-2026-10-23-routing.md).
# The task was written by an independent model author from held-out-brief.md, without access to this
# repository; its hidden tests live in evals/routing-2026-10-23/cases/, never in the sandbox. The graders
# are the evaluator's, fixed by the pre-registration. JSON is valid YAML. Runs spend money: never run
# without a cap and a yes.
{
  "schema_version": "1.0",
  "name": "hr-retry-limit",
  "description": "Setting trace: a retry count of 0 is dropped in three different files of a small fetch client.",
  "tags": [
    "held-out",
    "routing",
    "standard"
  ],
  "runs": 6,
  "context": {
    "scaffold_script": "scaffold.sh",
    "add_dirs": []
  },
  "execution": {
    "prompt": "I can't turn retries off in our little fetch client (the fetchkit package). `--retries 0` on the command line, or `max_retries` set to 0 in code, still ends up making four attempts when the server keeps failing; I want 0 to mean one attempt and then give up. Please use subagents to trace where the retry count is read and set across the package, starting from the CLI flag and from the Client, and report every place that touches it. Then fix it so 0 really means no retries, without changing what happens when no retry count is given.",
    "max_turns": 16,
    "timeout_seconds": 900,
    "model": "opus",
    "allowed_tools": [
      "Read",
      "Edit",
      "Write",
      "Bash",
      "Glob",
      "Grep",
      "Agent",
      "Skill"
    ]
  },
  "graders": [
    {
      "type": "llm",
      "name": "quality-judge",
      "focus": "files",
      "criteria": "You are grading the final state of a small Python project after a coding task. Read the project's files. A correct finish: A retry count of 0 (from the --retries flag, from settings overrides, from the FETCHKIT_MAX_RETRIES environment variable, or passed to the client directly) results in exactly one attempt, while the default of three retries and other explicit counts behave as before. Decide whether the code now does what that sentence describes, judging behaviour, not style or comments. PASS if it does. FAIL if it does not, or only partly does."
    },
    {
      "type": "tool_used",
      "name": "dispatched",
      "tool": "Agent",
      "min": 1
    },
    {
      "type": "regex",
      "name": "hook-warned",
      "target": "trace",
      "pattern": "dojo-router: this .* dispatch names no model",
      "arm": "with-only"
    }
  ],
  "expected_outcome": "A retry count of 0 (from the --retries flag, from settings overrides, from the FETCHKIT_MAX_RETRIES environment variable, or passed to the client directly) results in exactly one attempt, while the default of three retries and other explicit counts behave as before."
}
