# Eval scaffold for dojo-protocol. JSON is valid YAML; comment lines are allowed.
# Not run by the build. `claude plugin eval` spends money; run it only on purpose,
# with --max-cost-usd and --no-publish. Edit is a gated tool: the run needs --allow-tools Edit. The fixture repo is written by context.scaffold_script, which runs only with --scaffold.
{
  "schema_version": "1.0",
  "name": "scout-before-edit",
  "description": "Rule 2 on a wide question: the retry limit is set in one place but used, tested and documented across several directories, and a decoy number (3 workers) must stay put. A small scout should map the ground before the main thread edits. A one-constant edit in one file is the opposite case; see trivial-fix-stays-inline. Edit is gated and needs --allow-tools.",
  "tags": [
    "protocol",
    "scout",
    "rule-2"
  ],
  "runs": 3,
  "context": {
    "scaffold_script": "scaffold.sh",
    "add_dirs": []
  },
  "execution": {
    "prompt": "The retry limit in this repo is 3 and should be 5. Update it everywhere it is set, used, tested or documented so the code, tests and docs agree. Map every place first, then make the edits.",
    "max_turns": 25,
    "timeout_seconds": 300,
    "model": "sonnet",
    "allowed_tools": [
      "Read",
      "Glob",
      "Grep",
      "Edit",
      "Agent",
      "Skill"
    ]
  },
  "graders": [
    {
      "type": "tool_used",
      "name": "used-scout",
      "tool": "Agent",
      "input_match": "dojo-protocol:scout",
      "min": 1,
      "weight": 2
    },
    {
      "type": "tool_order",
      "name": "scout-before-edit",
      "before": {
        "tool": "Agent",
        "input_match": "dojo-protocol:scout"
      },
      "after": {
        "tool": "Edit"
      }
    },
    {
      "type": "llm",
      "name": "edits-are-complete-and-scoped",
      "criteria": "RETRY_LIMIT in src/net/config.py is 5; the assertions in tests/test_client.py and tests/test_worker.py and the retry sentence in docs/usage.md now say 5; WORKERS in src/jobs/scheduler.py, TIMEOUT_SECONDS, and the sentence about 3 workers are unchanged."
    }
  ],
  "expected_outcome": "A scout subagent maps every place the limit lives; the main thread then changes the constant, the two tests and the doc sentence, and leaves the worker count alone."
}
