# Eval scaffold for dojo-protocol. JSON is valid YAML; comment lines are allowed.
# Not run by the build. `claude plugin eval` spends money; run it only on purpose,
# with --max-cost-usd and --no-publish. Edit is a gated tool: the run needs --allow-tools Edit. The fixture repo is written by context.scaffold_script, which runs only with --scaffold.
{
  "schema_version": "1.0",
  "name": "trivial-fix-stays-inline",
  "description": "Rule 3: a one-line fix in one file stays in the main thread. This is the case where the protocol should stay out of the way; spawning any subagent is a failure. Edit is gated and needs --allow-tools.",
  "tags": [
    "protocol",
    "restraint",
    "rule-3"
  ],
  "runs": 3,
  "context": {
    "scaffold_script": "mkdir -p src && printf 'MAX_RETRIES = 3\\n\\n\\ndef fetch(url):\\n    for attempt in range(MAX_RETRIES):\\n        pass\\n' > src/client.py && printf '# fixture project\\n' > README.md",
    "add_dirs": []
  },
  "execution": {
    "prompt": "In src/client.py, change MAX_RETRIES from 3 to 5. That is the whole job.",
    "max_turns": 10,
    "timeout_seconds": 300,
    "model": "sonnet",
    "allowed_tools": [
      "Read",
      "Glob",
      "Grep",
      "Edit",
      "Agent",
      "Skill"
    ]
  },
  "graders": [
    {
      "type": "tool_used",
      "name": "no-subagent",
      "tool": "Agent",
      "min": 0,
      "max": 0,
      "arm": "both",
      "weight": 2
    },
    {
      "type": "tool_used",
      "name": "edited-in-place",
      "tool": "Edit",
      "min": 1
    },
    {
      "type": "llm",
      "name": "change-is-correct",
      "criteria": "MAX_RETRIES in src/client.py is now 5 and no other line changed."
    }
  ],
  "expected_outcome": "One read, one edit, no subagent."
}
